services:
  - type: web
    name: zevora-website
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ENABLE_PUBLIC_GENERATION
        value: "false"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ENABLE_AI_STYLIST
        value: "false"
